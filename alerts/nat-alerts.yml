# nat-alerts.yml (alerts)
#
# Every Prometheus alert rule this project ships out of the box, covering
# NAT capacity (conntrack/port exhaustion), node health, fleet-floor
# violations, drop rate, buddy-sync coverage, and aggregate throughput.
# Mounted into the Prometheus container by terraform/modules/observability
# and referenced from ansible/templates/prometheus.yml.tftpl's rule_files.
# See docs/NAT-GATEWAY-DEFINITIVE-GUIDE.html §7.4 "Alert Rules" for the
# full summary table (condition + severity for each alert).
#
# -----------------------------------------------------
# Usage:
#
# - Fires into Alertmanager (ansible/templates/alertmanager.yml), which
#   ships with a no-op receiver by default -- wire up a real receiver
#   (Slack/PagerDuty/email/webhook) before relying on this in production.
# - Every alert's `description` annotation explains what actually
#   triggered it and the concrete first-response action to take -- see
#   also docs/NAT-GATEWAY-DEFINITIVE-GUIDE.html §10.4 "Troubleshooting
#   Playbook" for the general operational context these tie into.
#
# -----------------------------------------------------
# Best Practices:
#
# - Treat `severity: info` alerts (e.g. NATConntrackBuddyUnpaired) as
#   just that -- they are coverage/mitigation signals, not health
#   signals, and should not page anyone by themselves.
# - NATBGPSessionNotEstablished/NATIPFailoverSelfNotAnnounced page on the
#   fleet's failover *capability*, not on an active failover -- a node
#   with either condition can still be forwarding traffic fine today, but
#   cannot safely receive its buddy's shared IP (or reliably keep its own)
#   if a failure happens next. Treat as urgent regardless.
#
# -----------------------------------------------------
# Author:
# - Sandip Gangdhar
# - GitHub: https://github.com/sandipgangdhar
#
# (c) Linode-NAT-Gateway (LNG) | Developed by Sandip Gangdhar | 2026
# -----------------------------------------------------

groups:
  - name: lng-nat-gateway
    rules:
      - alert: NATConntrackTableNearFull
        expr: nat_conntrack_utilization_ratio > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Conntrack table on {{ $labels.node }} ({{ $labels.pool }}) is {{ $value | humanizePercentage }} full"
          description: "natctl should scale the pool out before this becomes critical; verify auto_provision_enabled and max_nodes for this pool."

      - alert: NATConntrackTableCritical
        expr: nat_conntrack_utilization_ratio > 0.95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Conntrack table on {{ $labels.node }} ({{ $labels.pool }}) is critically full ({{ $value | humanizePercentage }})"
          description: "New connections on this node will start failing imminently. Check natctl logs for why it hasn't scaled the pool out."

      - alert: NATPortExhaustionImminent
        expr: (nat_port_available_total / (nat_port_available_total + nat_port_allocated_total)) < 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Public IP {{ $labels.public_ip }} ({{ $labels.protocol }}) on {{ $labels.node }} is running low on ephemeral ports"
          description: "Consider raising egress_ips_per_node for this pool (an extra public IP allocated to the node, splitting the per-IP port budget across both) or scaling the pool out."

      - alert: NATNodeDown
        expr: up{job="nat_exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "nat_exporter on {{ $labels.instance }} is not reachable"
          description: "Clients drop a node from their routes as soon as natctl marks it unhealthy and publishes that to the roster (within seconds, see health_check_interval_seconds), so this alert is about the node itself needing attention, not about client impact. If natctl fenced the node (see the leader-election section of the runbook), it stays powered off until an operator boots it."

      - alert: NATNodeUnhealthy
        expr: nat_node_healthy == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.node }} ({{ $labels.pool }}) answers but its synthetic health check is failing"
          description: "Check nat_node_health_check{node=\"{{ $labels.node }}\"} to see which specific check failed (ip_forward, nftables_loaded, egress_reachable)."

      - alert: NATPoolBelowFloor
        expr: count by (pool) (nat_node_healthy == 1) < on(pool) group_left() natctl_pool_min_nodes
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Pool {{ $labels.pool }} has fewer healthy nodes than its configured min_nodes"
          description: "natctl should be provisioning elastic capacity to restore the floor automatically — check natctl logs if this persists. Cross-check natctl_pool_last_scale_event_info and natctl_pool_autoscale_breach_streak (see docs/NAT-GATEWAY-DEFINITIVE-GUIDE.html §7.2 'Every Metric, Explained') for why it hasn't."

      - alert: NATHighDropRate
        expr: rate(nat_nftables_drops_total[5m]) > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Elevated nftables drop rate on {{ $labels.node }} ({{ $labels.table }}/{{ $labels.reason }})"
          description: "Could indicate a misconfigured allow-list, an attempted policy violation, or a routing issue upstream of this node."

      - alert: NATConntrackBuddyUnpaired
        expr: nat_conntrack_buddy_paired == 0
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.node }} ({{ $labels.pool }}) has no conntrack buddy assigned"
          description: "Informational, not urgent: this node is still fully healthy and fully in client-agent's ECMP rotation (buddy-sync is a session-loss MITIGATION, not a health signal — see docs/NAT-GATEWAY-DEFINITIVE-GUIDE.html §4.3 'Connection-State Sync'). Expected transiently on any membership change, or permanently if the pool has an odd number of healthy nodes, or if conntrack_buddy_sync_enabled is false for this pool. Investigate only if it persists on a pool that expects buddy-sync to be active."

      - alert: NATThroughputNearPoolLimit
        # Compares natctl's own throughput signal to its own scale-out watermark. That signal is the pool's
        # traffic divided by the real network limit of the pool's healthy nodes (each plan's published limit,
        # read from the provider's API, with send and receive each measured against their own limit), so this
        # rule needs no per-plan constant and stays correct whichever instance size a pool uses.
        expr: max by (pool) (natctl_pool_autoscale_current{metric="throughput_ratio"}) > on (pool) max by (pool) (natctl_pool_autoscale_high_watermark{metric="throughput_ratio"})
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Aggregate throughput for pool {{ $labels.pool }} is above the scale-out watermark for the pool's total plan bandwidth"
          description: "Feeds natctl's own scale-out decision; if it hasn't already added a node, investigate why (check cooldown_seconds and max_nodes)."

      - alert: NATCPUSoftirqSaturationHigh
        expr: rate(nat_cpu_softirq_seconds_total[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Core {{ $labels.cpu }} on {{ $labels.node }} ({{ $labels.pool }}) is {{ $value | humanizePercentage }} saturated with network packet-processing (softirq) work"
          description: "Feeds natctl's own scale-out decision (the busiest core anywhere in the pool, deliberately not an average); if it hasn't already added a node, investigate why (check cooldown_seconds and max_nodes). A packet-rate-driven bottleneck like this can precede real throughput/conntrack pressure rather than follow it -- see docs/NAT-GATEWAY-DEFINITIVE-GUIDE.html §5.2 'The Autoscaling Algorithm'."

      - alert: NATBGPSessionNotEstablished
        expr: nat_bgp_peer_state == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "BGP session {{ $labels.node }} -> {{ $labels.peer }} ({{ $labels.pool }}) is not Established"
          description: "This node cannot reliably announce or fail over its shared IP over this session. Check `vtysh -c 'show bgp summary'` on the node and route-reflector reachability. See docs/NAT-GATEWAY-DEFINITIVE-GUIDE.html §4.4 'BGP-Based IP Failover'."

      - alert: NATIPFailoverSelfNotAnnounced
        expr: (nat_ip_failover_self_announced == 0) and on(node) (nat_node_healthy == 1)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.node }} ({{ $labels.pool }}) is healthy but is not announcing its own primary shared IP"
          description: "FRR route-map for this node's primary IP is missing or misapplied — this node's shared IP will not be reachable via BGP. Check the node's FRR config against ansible/templates/frr-bgpd.conf.tftpl (or equivalent) and re-run the natctl reconcile that renders it."

      - alert: NATConntrackInsertFailuresHigh
        expr: rate(nat_conntrack_stat_total{stat="insert_failed"}[5m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kernel conntrack insert failures on {{ $labels.node }} ({{ $labels.pool }}) are elevated"
          description: "A harder resource-exhaustion signal than nat_conntrack_utilization_ratio alone (kernel actually rejected new connections) — parity with AWS NAT Gateway's ErrorPortAllocation. Check nf_conntrack_max headroom and whether the pool should scale out."

      - alert: NATAutoscaleCeilingReached
        expr: natctl_pool_autoscale_breach_streak > 0 and on(pool) (natctl_pool_floor_nodes + natctl_pool_elastic_nodes) >= on(pool) natctl_pool_max_nodes
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pool {{ $labels.pool }} is breaching a scale-out watermark ({{ $labels.metric }}) but is already at max_nodes"
          description: "natctl cannot add more capacity — this alert exists because natctl won't fire NATConntrackTableCritical-style urgency on its own once it's out of room. Raise max_nodes for this pool or investigate the sustained demand."

      - alert: NATLeaderElectionSplitBrainOrNoLeader
        expr: sum(natctl_leader_election_is_leader) by (pool) != 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Pool {{ $labels.pool }} (natctl_on_node_enabled) has {{ $value }} confirmed leaders, not exactly 1"
          description: "0 means every node's leader-election is stuck (check Object Storage lease-store reachability and each node's own natctl logs); more than 1 means a genuine split-brain in the fencing/election path, which STONITH fencing is designed to make effectively impossible — either result needs investigation, not just waiting for the next reconcile pass. A couple of reconcile passes' grace (natctl_leader_election_is_leader is only ever scraped every 30s via natctl_sd) already absorbs the handful of seconds a real, healthy re-election normally takes — this alert firing means it did not resolve on its own. Absent entirely for pools with leader_election disabled (single-dedicated-host mode has no is_leader gauge to sum)."

      - alert: NATFencedNodeRestoreBudgetExhausted
        expr: max by (pool, fenced_node) (natctl_fenced_node_restore_budget_exhausted) == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Fenced node {{ $labels.fenced_node }} in pool {{ $labels.pool }} was restored automatically as often as allowed and is being left powered off"
          description: "natctl powered this node off (fencing) and has already booted it back the maximum number of times inside its restore window (fenced_node_restore_max_attempts per fenced_node_restore_window_seconds), and it keeps ending up fenced again or never turning healthy. It stays off until an operator investigates why it keeps failing (check the fencing candidate's journal: `journalctl -u natctl | grep -i 'fencing previous leader'`, and the node's own natctl/nat-exporter logs) and boots it by hand with `linode-cli linodes boot <id>`. The pool is running one baseline node short until then; natctl compensates with elastic capacity while under max_nodes."

      - alert: NATFencedNodePendingRestore
        expr: max by (pool) (natctl_fenced_nodes_pending) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Pool {{ $labels.pool }} has had a fenced node awaiting restore for over 15 minutes"
          description: "A node natctl powered off has not been restored and confirmed healthy within 15 minutes. Normally the leader boots it after fenced_node_restore_cooldown_seconds and clears the record once it has been healthy for fenced_node_restore_stable_seconds, so this means the restore is not happening: automatic restore is disabled, an operator hold or pause is in effect (see NATFencedRestoreHeldLong and `natctl_cli fenced-nodes`), the pool is a bare 2-node pool without a witness, the node keeps failing (see NATFencedNodeRestoreBudgetExhausted), or there is no confirmed leader (see NATLeaderElectionSplitBrainOrNoLeader). Check `natctl_fenced_node_restore_attempts` and the leader's journal for `restoring fenced node`."

      - alert: NATFencedRestoreHeldLong
        expr: max by (pool) (natctl_fenced_node_held) == 1 or max by (pool) (natctl_fenced_restore_paused) == 1
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Pool {{ $labels.pool }} has had a fenced node held off (or its automatic restore paused) by an operator for over an hour"
          description: "An operator ran `natctl_cli hold-fenced-node` or `pause-fenced-restore` and the hold has now lasted more than an hour. While it lasts the leader does not boot the node and the pool adds elastic capacity for it (if it has room under max_nodes), so this is a cost and a capacity risk that is easy to forget. Release it with `natctl_cli release-fenced-node` / `resume-fenced-restore` once the investigation is done, or let it expire (default 4 h, at most 24 h)."

      - alert: NATFencedHoldWithoutFence
        expr: max by (pool) (natctl_fenced_hold_without_fence) == 1 or max by (pool) (natctl_fenced_restore_paused_without_fence) == 1
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Pool {{ $labels.pool }} has an operator hold or pause in effect on a node that is not currently fenced"
          description: "A `natctl_cli hold-fenced-node` or `pause-fenced-restore` is still active but nothing is fenced right now, so it has no capacity impact today -- NATFencedRestoreHeldLong stays silent in this state, since that alert only fires once a hold is actually blocking a real restore. This is the case a hold gets forgotten in: it sits invisible until the node it covers is next fenced for any reason, at which point it silently blocks that restore too. Check `natctl_cli fenced-nodes --pool {{ $labels.pool }}`'s `holds` field and release it with `natctl_cli release-fenced-node` / `resume-fenced-restore` if it is no longer needed."

      - alert: NATSelfPeerHealthDisagreementSustained
        expr: max by (pool) (natctl_self_peer_disagree_streak) > 30
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "A node in pool {{ $labels.pool }} has had every reachable peer disagree with its own healthy self-check for a sustained period"
          description: "This node's own self-check keeps reporting healthy while every reachable peer's independent check of it disagrees -- the roster already correctly excludes it once this streak crosses SELF_HEALTH_PEER_DISAGREE_SUSTAIN_PASSES, but a streak still climbing this long after that means the underlying condition peers are seeing hasn't cleared. Check that node's own exporter/NAT data-plane health directly rather than trusting its self-check, and check whether client-side roster propagation (client-agent's own roster-URL failover) is keeping up -- a stuck failover there can make client-facing impact outlast the underlying condition."

      - alert: NATLinodeAPICircuitBreakerOpen
        expr: natctl_linode_api_circuit_open == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "natctl has stopped attempting mutating Linode API calls after repeated failures"
          description: "A run of consecutive network errors or 5xx responses opened the circuit breaker — evidence of a provider-side incident, not a bad request on this project's own side (a 4xx never opens it). Fencing, elastic provisioning, and IP-sharing changes are all paused until it closes again; read-only work (discover, health checks) is unaffected, so the roster keeps serving current state. Check Linode's own status page before assuming this project's code is at fault — this closes on its own once the API recovers and a trial call succeeds, no operator action needed unless the underlying incident is prolonged."

      - alert: NATPoolCostCeilingExceeded
        expr: natctl_pool_hourly_cost_dollars > on(pool) natctl_pool_cost_ceiling_dollars
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pool {{ $labels.pool }}'s actual hourly cost exceeds its own max_nodes-derived ceiling"
          description: "natctl_pool_cost_ceiling_dollars is max_nodes times this pool's own base instance type's real price -- what this pool should never cost more than per hour if it's staying within its own configured capacity limit. A sustained breach means the fleet actually grew past that limit, a genuine bug signal (this project has hit exactly this class of bug before, in elastic-fleet ceiling enforcement), not a budget guess to second-guess. Alert-only: this never blocks or reverses scaling on its own, so investigate rather than assume it will self-resolve."

      - alert: NATPoolCostVelocityHigh
        expr: natctl_pool_cost_velocity_percent > on(pool) natctl_pool_cost_velocity_threshold_percent
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pool {{ $labels.pool }}'s hourly cost is rising faster than its own configured threshold"
          description: "natctl_pool_cost_velocity_percent is the percent change in natctl_pool_hourly_cost_dollars over this pool's own configured cost_velocity_window_seconds, compared against its own cost_velocity_threshold_percent -- both absent entirely for a pool that never opted in. Catches a cost climbing suspiciously fast even while still comfortably under any ceiling. A legitimate, healthy scale-out under real load can look identical to a runaway one from cost alone -- check natctl's own autoscale-explainability panels (why the last scale event fired) before assuming this is a bug rather than genuine, wanted traffic."

